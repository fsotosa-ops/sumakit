title: Informe académico
author: sumakit
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pdf:
      documentclass: article
      papersize: letter
      geometry:
        - top=1in
        - bottom=1in
        - left=1.1in
        - right=1.1in
      fontsize: 11pt
      linestretch: 1.05
      number-sections: true
      toc: false
      colorlinks: true
      linkcolor: sumakitaccent
      citecolor: sumakitaccent
      urlcolor: sumakitaccent
      cite-method: citeproc
      fig-align: center
      fig-width: 6.5
      fig-cap-location: bottom
      tbl-cap-location: top
      df-print: kable
      include-in-header: preambulo.tex
      lang: en
