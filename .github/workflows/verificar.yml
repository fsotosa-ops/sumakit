name: verificar

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar
        run: uv sync --all-extras

      # La regresión que motivó esto: en Colab, un `pip install sumakit` a secas
      # instalaba un paquete que no podía dibujar, porque el EDA vivía tras un
      # extra. Ahora el núcleo hace el taller completo, y esto lo fija en un
      # entorno donde SOLO está el núcleo instalado.
      - name: Un `pip install sumakit` a secas hace el taller
        run: |
          uv venv /tmp/solo-nucleo
          VIRTUAL_ENV=/tmp/solo-nucleo uv pip install .
          /tmp/solo-nucleo/bin/python -c "
          import sys
          import pandas as pd
          import sumakit
          from sumakit import profile

          # Importar el paquete no puede levantar matplotlib: se paga al usarlo.
          # Sin esto, abrir un notebook para mirar una tabla cuesta el arranque
          # entero de seaborn.
          pesadas = [m for m in ('matplotlib', 'seaborn', 'pptx') if m in sys.modules]
          assert not pesadas, f'importar sumakit arrastró {pesadas}'

          df = pd.DataFrame({'a': [1, 2, 2, None], 'b': list('xyyz')})
          assert not profile.alerts(df).empty
          profile.as_markdown(profile.alerts(df), index=False)  # necesita tabulate

          from sumakit import plots
          plots.distributions(df)  # necesita matplotlib y seaborn
          from sumakit.deck import Deck  # necesita python-pptx
          print('el núcleo hace el taller sin pedir extras')
          "

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      # `-m "not lento"` excluye las cuatro que renderizan con Quarto de verdad:
      # necesitan Quarto instalado Y el paquete visible desde el kernel que
      # Quarto levanta, que no es el del entorno virtual. Fallan por ambiente.
      - name: Pruebas
        run: uv run pytest -q -m "not lento"
