[project]
name = "sumakit"
version = "0.1.0"
description = "Utilidades de EDA y analítica reutilizables: tablas de perfilado, diagnóstico estadístico y gráficos con un tema consistente."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jinja2>=3.1.6",
    "altair>=6.2.2",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=8.39.0",
    "nbformat>=5.11.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "quarto-cli>=1.10.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: renderiza con Quarto de verdad; ~20 s por prueba"]
filterwarnings = ["error::FutureWarning"]
