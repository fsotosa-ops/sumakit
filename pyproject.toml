[project]
name = "sumakit"
version = "0.1.0"
description = "Utilidades de EDA y analítica reutilizables: tablas de perfilado, diagnóstico estadístico y gráficos con un tema consistente."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jinja2>=3.1.6",
    "altair>=6.2.2",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
