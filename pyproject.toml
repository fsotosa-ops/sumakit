[project]
name = "sumakit"
version = "0.1.0"
description = "Utilidades de EDA y analítica reutilizables: tablas de perfilado, diagnóstico estadístico y gráficos con un tema consistente."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# El núcleo es el SDK, y el SDK solo necesita DataFrames y la biblioteca
# estándar. Todo lo demás va en extras: un contenedor que solo publica tablas no
# tiene por qué cargar matplotlib, y un notebook de EDA no necesita python-pptx.
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
# Perfilado, estadística y gráficos: `profile`, `stats`, `plots`, `exploration`.
eda = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
# Gráficos interactivos: `interactive`.
interactive = ["altair>=6.2.2"]
# El entregable. **Es el que el ADR-0009 de suma-studio manda retirar**: el
# render es de Studio. Vive detrás de un extra mientras se retira.
report = [
    "jinja2>=3.1.6",
    "python-pptx>=1.0.2",
    "pillow>=12.3.0",
    "tabulate>=0.10.0",
]
ml = ["scikit-learn>=1.3"]
ui = ["streamlit>=1.36"]
all = [
    "sumakit[eda]",
    "sumakit[interactive]",
    "sumakit[report]",
    "sumakit[ml]",
    "sumakit[ui]",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.9",
    "ipykernel>=7.3.0",
    "ipython>=8.39.0",
    "nbformat>=5.11.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "quarto-cli>=1.10.18",
    "scikit-learn>=1.7.2",
    "streamlit>=1.62.0",
]

[project.scripts]
sumakit = "sumakit.report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumakit"]
# Las extensiones de Quarto viajan con el paquete, no con un repositorio.
artifacts = ["src/sumakit/report/_extensions/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: renderiza con Quarto de verdad; ~20 s por prueba"]
filterwarnings = ["error::FutureWarning"]

# ─────────────────────────────────────────────────────────────────── ruff ────
#
# Reemplaza a black e isort, igual que en `fsummer-platform/services/backend`.
# El estándar ya existía en casa y este paquete se había quedado fuera.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "N",        # pep8-naming  — la mitad del Issue #4 la caza esta
    "D",        # pydocstyle
]
ignore = [
    # El docstring de módulo y el de paquete bastan; exigirlo en cada `__init__`
    # y cada método produce ruido, no documentación.
    "D107",
    # Estilo Google: no se exige línea en blanco antes del resumen ni docstring
    # multilínea que empiece en la segunda línea.
    "D203", "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Las pruebas se nombran solas: `test_las_figuras_llegan_al_pdf` ya dice qué
# hace, y un docstring encima repetiría el nombre.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

# ─────────────────────────────────────────────────────────────────── mypy ────
#
# Gradual a propósito. Se empieza por los módulos que otros importan —`studio`
# es el SDK y `theme` lo consume el configurador— y el resto se va sumando.
# Poner el repo entero en estricto de golpe produce un `# type: ignore` por
# línea, que es peor que no tener tipos.

[tool.mypy]
# Sin fijar `python_version`: se usa el del intérprete. Fijarlo en 3.10 hace que
# mypy no pueda leer los stubs de numpy, que usan `type` de 3.12 — y el error
# sale dentro de numpy, no del código de aquí. El paquete sigue soportando 3.10
# en ejecución; lo que se comprueba es la versión con la que corre el CI.
files = ["src/sumakit"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["sumakit.studio", "sumakit.theme"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
