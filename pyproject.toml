[project]
name = "sumakit"
version = "0.3.0"
description = "Utilidades para talleres de ciencia de datos: perfilado, diagnóstico estadístico, gráficos con un tema consistente y el entregable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# El paquete corre en dos sitios —un notebook local y Colab— y los dos quieren
# dibujar. Por eso el EDA y el entregable son el núcleo y no un extra: un
# `pip install sumakit` que no puede hacer un histograma no sirve para nada, y
# tener que acordarse de `[eda,report]` es una forma de romperse en silencio.
#
# Detrás de extras queda solo lo que de verdad es opcional: scikit-learn, que no
# todo taller necesita, y las piezas de suma-studio, que están en stand-by.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jinja2>=3.1.6",
    "python-pptx>=1.0.2",
    "pillow>=12.3.0",
    "tabulate>=0.10.0",
    # `profile.as_markdown` y el render de `exploration` devuelven objetos de
    # display. En Colab IPython siempre está; en un `pip install` a secas no
    # estaba, y `as_markdown` moría con ModuleNotFoundError.
    "ipython>=8.0",
]

[project.optional-dependencies]
# Métricas de modelado: habilita `cluster` y la información mutua de
# `stats.target_report`.
ml = ["scikit-learn>=1.3"]
# Gráficos interactivos: `interactive`.
interactive = ["altair>=6.2.2"]

# `eda` y `report` se vacían, no se borran: hay notebooks con
# `pip install "sumakit[eda]"` escrito dentro, y un extra que no existe es un
# error de instalación. Lo que pedían ya viene en el núcleo.
eda = []
report = []

# En stand-by junto con suma-studio. El código se conserva; las dependencias no
# se instalan salvo que se pidan.
extract = ["dlt>=1.0"]
ui = ["streamlit>=1.36"]

all = [
    "sumakit[ml]",
    "sumakit[interactive]",
    "sumakit[extract]",
    "sumakit[ui]",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.9",
    "ipykernel>=7.3.0",
    "ipython>=8.39.0",
    "nbformat>=5.11.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "quarto-cli>=1.10.18",
    "scikit-learn>=1.7.2",
    "streamlit>=1.62.0",
]

[project.scripts]
sumakit = "sumakit.report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumakit"]
# Las extensiones de Quarto viajan con el paquete, no con un repositorio.
artifacts = ["src/sumakit/report/_extensions/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: renderiza con Quarto de verdad; ~20 s por prueba"]
filterwarnings = ["error::FutureWarning"]

# ─────────────────────────────────────────────────────────────────── ruff ────
#
# Reemplaza a black e isort, igual que en `fsummer-platform/services/backend`.
# El estándar ya existía en casa y este paquete se había quedado fuera.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "N",        # pep8-naming  — la mitad del Issue #4 la caza esta
    "D",        # pydocstyle
]
ignore = [
    # El docstring de módulo y el de paquete bastan; exigirlo en cada `__init__`
    # y cada método produce ruido, no documentación.
    "D107",
    # Estilo Google: no se exige línea en blanco antes del resumen ni docstring
    # multilínea que empiece en la segunda línea.
    "D203", "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Las pruebas se nombran solas: `test_las_figuras_llegan_al_pdf` ya dice qué
# hace, y un docstring encima repetiría el nombre.
"tests/**" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    # `X` para la matriz de features: la convención de scikit-learn, que el
    # código de `cluster` también respeta.
    "N806",
]

# ─────────────────────────────────────────────────────────────────── mypy ────
#
# Gradual a propósito. Se empieza por los módulos que otros importan —`studio`
# es el SDK y `theme` lo consume el configurador— y el resto se va sumando.
# Poner el repo entero en estricto de golpe produce un `# type: ignore` por
# línea, que es peor que no tener tipos.

[tool.mypy]
# Sin fijar `python_version`: se usa el del intérprete. Fijarlo en 3.10 hace que
# mypy no pueda leer los stubs de numpy, que usan `type` de 3.12 — y el error
# sale dentro de numpy, no del código de aquí. El paquete sigue soportando 3.10
# en ejecución; lo que se comprueba es la versión con la que corre el CI.
files = ["src/sumakit"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["sumakit.studio", "sumakit.theme"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
